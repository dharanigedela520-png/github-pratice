<!-- Working on Home Page -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Entry App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Data Entry App</h1>
    <p class="subtitle">Enter and manage basic records</p>

    <form id="dataForm">
      <input type="hidden" id="editIndex">

      <div class="form-grid">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Enter name" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter email" required>
        </div>

        <div class="field">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="Enter phone number" maxlength="10" required>
        </div>

        <div class="field">
          <label for="city">City</label>
          <input type="text" id="city" placeholder="Enter city" required>
        </div>
      </div>

      <div class="buttons">
        <button type="submit" id="saveBtn">Save Entry</button>
        <button type="button" id="cancelBtn" class="secondary hidden">Cancel Edit</button>
      </div>
    </form>

    <div class="table-section">
      <div class="table-header">
        <h2>Saved Records</h2>
        <input type="text" id="searchInput" placeholder="Search records...">
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>S.No</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>City</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="dataTableBody"></tbody>
        </table>
        <p id="emptyMessage">No records added yet.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
